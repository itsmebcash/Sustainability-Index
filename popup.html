<!DOCTYPE html>
<html>
<head>
  <title>Supply Chain Sustainability Index</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <img src="images/icon48.png" alt="Logo" class="logo">
      <h1>Supply Chain Sustainability Index</h1>
    </div>
    
    <div class="status">
      <p id="status-message">Analyzing current page...</p>
    </div>
    
    <div class="settings">
      <h2>Settings</h2>
      <label>
        <input type="checkbox" id="enable-extension" checked>
        Enable sustainability ratings
      </label>
      
      <label>
        <input type="checkbox" id="show-alternatives" checked>
        Show sustainable alternatives
      </label>
      
      <label>
        <input type="checkbox" id="detailed-reports" checked>
        Show detailed sustainability reports
      </label>
    </div>
    
    <div class="footer">
      <p>See the hidden cost of your cart</p>
      <button id="report-issue">Report an Issue</button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
